name: M1937 SDK CI

on:
  push:
    paths:
      - "SDK/**"
      - "Patch/src/dinput-proxy/**"
      - "Patch/src/level-selector/关卡名称.json"
      - "Patch/analysis/tools/OriginalLevelProbe.cs"
      - "Patch/analysis/tools/GameFrameProbe.cs"
      - "Patch/analysis/tools/Build-Probes.ps1"
      - ".github/workflows/sdk-ci.yml"
  pull_request:
    paths:
      - "SDK/**"
      - "Patch/src/dinput-proxy/**"
      - "Patch/src/level-selector/关卡名称.json"
      - "Patch/analysis/tools/OriginalLevelProbe.cs"
      - "Patch/analysis/tools/GameFrameProbe.cs"
      - "Patch/analysis/tools/Build-Probes.ps1"
      - ".github/workflows/sdk-ci.yml"

jobs:
  native-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated artifacts and single address source
        shell: pwsh
        run: ./SDK/tools/Test-SdkSingleSource.ps1
      - name: Compile SDK tests
        shell: cmd
        run: SDK\build.cmd --compile-only
      - name: Compile DirectInput plugin against SDK
        shell: cmd
        run: Patch\src\dinput-proxy\build.cmd
      - name: Compile runtime probes against generated C# addresses
        shell: pwsh
        run: |
          ./Patch/analysis/tools/Build-Probes.ps1 `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'probes')
