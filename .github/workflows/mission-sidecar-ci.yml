name: Mission Sidecar and Launcher CI

on:
  push:
    paths:
      - "Patch/tools/MissionSidecar/**"
      - "Patch/tools/Build-MissionSidecar.ps1"
      - "Patch/src/level-selector/**"
      - "Patch/analysis/tools/Test-LauncherConfiguration.ps1"
      - "SDK/generated/M1937Addresses.cs"
      - "SDK/include/M1937SDK/PluginABI.hpp"
      - "SDK/samples/mission-plugin/**"
      - "SDK/schemas/**"
      - "Mod/Missions/**"
      - ".github/workflows/mission-sidecar-ci.yml"
  pull_request:
    paths:
      - "Patch/tools/MissionSidecar/**"
      - "Patch/tools/Build-MissionSidecar.ps1"
      - "Patch/src/level-selector/**"
      - "Patch/analysis/tools/Test-LauncherConfiguration.ps1"
      - "SDK/generated/M1937Addresses.cs"
      - "SDK/include/M1937SDK/PluginABI.hpp"
      - "SDK/samples/mission-plugin/**"
      - "SDK/schemas/**"
      - "Mod/Missions/**"
      - ".github/workflows/mission-sidecar-ci.yml"

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build sidecar solution
        run: >
          dotnet build
          Patch/tools/MissionSidecar/MissionSidecar.slnx
          -c Release
      - name: Run state/event/schema tests
        run: >
          dotnet run
          --project
          Patch/tools/MissionSidecar/MissionSidecar.Tests/MissionSidecar.Tests.csproj
          -c Release
          --no-build
      - name: Publish task overlay
        run: >
          dotnet publish
          Patch/tools/MissionSidecar/MissionSidecar.Host/MissionSidecar.Host.csproj
          -c Release
          --no-build
          --no-restore
          -o "${{ runner.temp }}/MissionSidecar"
      - name: Compile native ABI sample plugin
        shell: pwsh
        run: |
          ./SDK/samples/mission-plugin/Build-SamplePlugin.ps1 `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'plugin')
      - name: Validate launcher configuration and input safety
        shell: pwsh
        run: |
          ./Patch/analysis/tools/Test-LauncherConfiguration.ps1 `
            -OutputRoot (Join-Path $env:RUNNER_TEMP 'launcher')
