name: Map Editor CI

on:
  push:
    paths:
      - "MapEditor/**"
      - "Remake/tools/ResourceFormats/**"
      - ".github/workflows/map-editor-ci.yml"
  pull_request:
    paths:
      - "MapEditor/**"
      - "Remake/tools/ResourceFormats/**"
      - ".github/workflows/map-editor-ci.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build MapEditor/MapEditor.slnx -c Release
      - name: Core tests
        run: dotnet run --project MapEditor/MapEditor.Tests/MapEditor.Tests.csproj -c Release --no-build
