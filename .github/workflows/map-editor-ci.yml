name: Map Editor CI

on:
  push:
    paths:
      - "MapEditor/**"
      - "Remake/tools/ResourceFormats/**"
      - "Mod/1937m*.vwf"
      - "Mod/Missions/**"
      - "SDK/schemas/**"
      - ".github/workflows/map-editor-ci.yml"
  pull_request:
    paths:
      - "MapEditor/**"
      - "Remake/tools/ResourceFormats/**"
      - "Mod/1937m*.vwf"
      - "Mod/Missions/**"
      - "SDK/schemas/**"
      - ".github/workflows/map-editor-ci.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Fetch VWF round-trip fixtures
        shell: pwsh
        run: git lfs pull --include="Mod/1937m*.vwf"
      - name: Build
        run: dotnet build MapEditor/MapEditor.slnx -c Release
      - name: Asset metadata is reproducible
        shell: pwsh
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP 'asset-metadata.json'
          ./MapEditor/tools/Generate-AssetMetadata.ps1 `
            -AssetRoot ./MapEditor/Assets/Original `
            -OutputPath $candidate
          if ((Get-FileHash $candidate).Hash -ne `
              (Get-FileHash `
                ./MapEditor/Assets/Original/asset-metadata.json).Hash) {
            throw 'Committed asset metadata is not reproducible.'
          }
      - name: Core tests
        shell: pwsh
        run: |
          $env:M1937_TEST_ROOT = Join-Path $env:RUNNER_TEMP 'map-editor-tests'
          $env:M1937_TEST_VWF_DIRECTORY = (Resolve-Path ./Mod).Path
          $env:M1937_TEST_VWF = (Resolve-Path ./Mod/1937m000.vwf).Path
          $env:M1937_MAPEDITOR_ASSETS = `
            (Resolve-Path ./MapEditor/Assets/Original).Path
          dotnet run `
            --project MapEditor/MapEditor.Tests/MapEditor.Tests.csproj `
            -c Release --no-build
      - name: Publish runnable editor
        run: >
          dotnet publish MapEditor/MapEditor.App/MapEditor.App.csproj
          -c Release --no-build
          -o "${{ runner.temp }}/MapEditor"
