name: Remake CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.1"
  GODOT_ARCHIVE_SHA256: "C7A289051EAEFB460B0106B60E9CD5BEE0EF55FD102DCB2BED1EB356CF3D90A1"
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

jobs:
  fast-gate:
    name: Fast source gate
    runs-on: windows-latest
    steps:
      - name: Check out source without LFS game content
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Prepare NuGet cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:NUGET_PACKAGES | Out-Null

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            Remake/**/*.csproj
            MapEditor/**/*.csproj

      - name: Download verified Godot
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'godot.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'godot'
          $url = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION-stable/Godot_v$env:GODOT_VERSION-stable_win64.exe.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actual -ne $env:GODOT_ARCHIVE_SHA256) { throw "Unexpected Godot SHA-256: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $console = Get-ChildItem -LiteralPath $destination -Filter '*_console.exe' | Select-Object -First 1
          if ($null -eq $console) { throw 'Godot console executable was not found.' }
          "GODOT4=$($console.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run fast gate
        shell: pwsh
        run: ./Remake/tools/Invoke-RemakeFastGate.ps1 -GodotExecutable $env:GODOT4

  synthetic-content-gate:
    name: Synthetic native-content gate
    runs-on: windows-latest
    steps:
      - name: Check out source without LFS game content
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Prepare NuGet cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:NUGET_PACKAGES | Out-Null

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            Remake/**/*.csproj
            MapEditor/**/*.csproj

      - name: Download verified Godot
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'godot.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'godot'
          $url = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION-stable/Godot_v$env:GODOT_VERSION-stable_win64.exe.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actual -ne $env:GODOT_ARCHIVE_SHA256) { throw "Unexpected Godot SHA-256: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $console = Get-ChildItem -LiteralPath $destination -Filter '*_console.exe' | Select-Object -First 1
          if ($null -eq $console) { throw 'Godot console executable was not found.' }
          "GODOT4=$($console.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run content gate with clean-room fixtures
        shell: pwsh
        run: ./Remake/tools/Invoke-RemakeContentGate.ps1 -GodotExecutable $env:GODOT4

  source-policy:
    name: No distributable or original game payloads
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - shell: pwsh
        run: ./Remake/tools/Check-NoOriginalAssets.ps1
